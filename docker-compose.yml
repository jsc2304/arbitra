# Local development backend: Firebase emulators for Auth, Firestore and Storage.
# Start with `npm run emulators` (docker compose up -d --build --wait firebase); the Emulator UI is at http://localhost:4000.
# Data is exported to the `emulator-data` volume on shutdown and imported on the next start.
services:
  firebase:
    build:
      context: docker
      dockerfile: firebase-emulators.Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4400:4400"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:9199:9199"
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
      - ./storage.rules:/workspace/storage.rules:ro
      - emulator-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([4000, 8080, 9099].map((p) => fetch('http://127.0.0.1:' + p))).then(() => process.exit(0), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    stop_grace_period: 30s

volumes:
  emulator-data:

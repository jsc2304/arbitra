name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Arbitra version (app footer or CHANGELOG.md) and the `arbitra-mcp` version if the MCP server is involved
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Local emulators or self-hosted, OS, Node.js version, LLM provider, IDE agent
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output with tokens and keys removed
      render: text
